services:
  db:
    build:
      context: .
      dockerfile: ./db/Dockerfile
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-buss1ness!2026}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: always

  web:
    build:
      context: .
      dockerfile: RecursosHumanosWeb/Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__RecursosHumanosContext=Server=db;Database=RecursosHumanos;User Id=sa;Password=${MSSQL_SA_PASSWORD:-buss1ness!2026};TrustServerCertificate=True;
    depends_on:
      - db
    restart: always

volumes:
  mssql-data:
