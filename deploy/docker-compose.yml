services:
  api_permisos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: itsmrh_gestion_permisos_api
    restart: unless-stopped
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__HumanResourcesContext=Server=nexsmart_central_db_sql;Database=DB_Production_HumanResources;User Id=sa;Password=${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD en el archivo .env};Encrypt=False;TrustServerCertificate=True;
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Evidences__UploadsPath=/app/evidences
    volumes:
      - itsmrh_dataprotection_keys:/app/keys
      - itsmrh_evidences:/app/evidences
    networks:
      - nexsmart_network

volumes:
  itsmrh_dataprotection_keys:
  itsmrh_evidences:


networks:
  nexsmart_network:
    external: true
    name: nexsmart_shared_network

