services:
  api_permisos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: itsmrh_gestion_permisos_api
    restart: unless-stopped
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__RecursosHumanosContext=Server=nexsmart_central_db_sql;Database=RecursosHumanosDB;User Id=sa;Password=Buss1ness.2026;Encrypt=False;TrustServerCertificate=True;
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    volumes:
      - itsmrh_dataprotection_keys:/app/keys
    networks:
      - nexsmart_network

volumes:
  itsmrh_dataprotection_keys:


networks:
  nexsmart_network:
    external: true
    name: nexsmart_shared_network

