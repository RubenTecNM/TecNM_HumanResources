services:
  api_permisos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: itsmrh_gestion_permisos_api
    restart: unless-stopped
    ports:
      - "5011:5011"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5011
      - ConnectionStrings__RecursosHumanosContext=Server=sqlserver_central;Database=RecursosHumanosDB;User Id=sa;Password=Buss1ness.2026;Encrypt=False;TrustServerCertificate=True;
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    networks:
      - nexsmart_network

networks:
  nexsmart_network:
    external: true
    name: nexsmart_shared_network

