name: deploy

services:
  api_permisos:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: itsmrh_gestion_permisos_api:main
    container_name: itsmrh_gestion_permisos_api
    restart: unless-stopped
    ports:
      - "5013:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__HumanResourcesContext=Server=nexsmart_central_db_sql;Database=HumanResourcesProduction;User Id=sa;Password=${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD en el archivo .env};Encrypt=False;TrustServerCertificate=True;
    volumes:
      - itsmrh_dataprotection_keys:/app/keys
      - itsmrh_evidences:/app/App_Data/Evidences
      - itsmrh_logs:/app/logs
    networks:
      - nexsmart_network

volumes:
  itsmrh_dataprotection_keys:
  itsmrh_evidences:
  itsmrh_logs:

networks:
  nexsmart_network:
    external: true
    name: nexsmart_shared_network
